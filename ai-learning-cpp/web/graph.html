<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识图谱可视化 — AILearning</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117; color: #c9d1d9;
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d;
      position: relative; z-index: 10;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header h1 span { color: #58a6ff; }
    .toolbar { display: flex; gap: 8px; }
    button, input, select {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer;
      outline: none;
    }
    button:hover { background: #30363d; }
    button.primary { background: #238636; border-color: #2ea043; }
    button.primary:hover { background: #2ea043; }
    input { width: 180px; }
    .stats {
      display: flex; gap: 16px; font-size: 12px; color: #8b949e;
    }
    .stats span { color: #58a6ff; font-weight: 600; }

    #graph-container {
      width: 100vw; height: calc(100vh - 52px);
      position: relative;
    }
    svg { width: 100%; height: 100%; }

    .node circle {
      stroke: #fff; stroke-width: 1.5px;
      transition: all 0.2s;
    }
    .node:hover circle { stroke: #58a6ff; stroke-width: 3px; }
    .node text {
      font-size: 11px; fill: #c9d1d9;
      pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .link {
      stroke: #30363d; stroke-opacity: 0.6;
    }
    .link-label {
      font-size: 9px; fill: #8b949e;
      pointer-events: none;
    }

    /* Tooltip */
    #tooltip {
      position: absolute; background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; padding: 12px; font-size: 12px;
      pointer-events: none; opacity: 0; transition: opacity 0.2s;
      max-width: 280px; z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #tooltip.visible { opacity: 1; }
    #tooltip .tt-title { color: #58a6ff; font-weight: 600; margin-bottom: 6px; }
    #tooltip .tt-row { display: flex; justify-content: space-between; margin: 2px 0; }
    #tooltip .tt-key { color: #8b949e; }
    #tooltip .tt-val { color: #c9d1d9; }

    /* Loading */
    #loading {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #0d1117; z-index: 30; font-size: 14px; color: #8b949e;
    }
    .spinner {
      width: 24px; height: 24px; border: 2px solid #30363d;
      border-top-color: #58a6ff; border-radius: 50%;
      animation: spin 1s linear infinite; margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Legend */
    #legend {
      position: absolute; bottom: 16px; left: 16px;
      background: rgba(22,27,34,0.9); border: 1px solid #30363d;
      border-radius: 8px; padding: 12px; font-size: 11px;
      max-height: 200px; overflow-y: auto;
    }
    #legend .leg-item { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    #legend .leg-dot { width: 10px; height: 10px; border-radius: 50%; }
  </style>
</head>
<body>

<header>
  <h1><span>AI</span>Learning 知识图谱</h1>
  <div class="toolbar">
    <input id="search-input" type="text" placeholder="搜索实体..." />
    <button id="btn-search">搜索</button>
    <select id="format-select">
      <option value="d3">D3 格式</option>
      <option value="cytoscape">Cytoscape</option>
    </select>
    <button id="btn-refresh" class="primary">刷新</button>
  </div>
  <div class="stats">
    <div>节点: <span id="stat-nodes">0</span></div>
    <div>边: <span id="stat-edges">0</span></div>
    <div>类型: <span id="stat-types">0</span></div>
  </div>
</header>

<div id="graph-container">
  <div id="loading"><div class="spinner"></div>加载知识图谱...</div>
  <svg id="graph-svg"></svg>
  <div id="tooltip"></div>
  <div id="legend"></div>
</div>

<script>
const API_BASE = window.location.origin;
const colorScale = d3.scaleOrdinal(d3.schemeCategory10);
let simulation, svg, g, zoom;
let nodesData = [], linksData = [];

// ── 加载图谱 ──────────────────────────────────────────────
async function loadGraph(format = 'd3') {
  document.getElementById('loading').style.display = 'flex';
  try {
    const resp = await fetch(`${API_BASE}/api/knowledge/graph?format=${format}`);
    const data = await resp.json();

    nodesData = data.nodes || [];
    linksData = data.links || data.edges || [];

    // 统计
    const types = new Set(nodesData.map(n => n.type));
    document.getElementById('stat-nodes').textContent = nodesData.length;
    document.getElementById('stat-edges').textContent = linksData.length;
    document.getElementById('stat-types').textContent = types.size;

    renderGraph(nodesData, linksData);
    renderLegend(types);
  } catch (err) {
    alert('加载失败: ' + err.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

// ── 渲染力导向图 ──────────────────────────────────────────
function renderGraph(nodes, links) {
  const container = document.getElementById('graph-container');
  const width = container.clientWidth;
  const height = container.clientHeight;

  d3.select('#graph-svg').selectAll('*').remove();
  svg = d3.select('#graph-svg')
    .attr('width', width).attr('height', height);

  g = svg.append('g');

  zoom = d3.zoom()
    .scaleExtent([0.1, 4])
    .on('zoom', (e) => g.attr('transform', e.transform));
  svg.call(zoom);

  // 箭头标记
  svg.append('defs').append('marker')
    .attr('id', 'arrow').attr('viewBox', '0 -5 10 10')
    .attr('refX', 22).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path').attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', '#30363d');

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(30));

  // 连线
  const link = g.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('class', 'link')
    .attr('marker-end', 'url(#arrow)');

  // 连线标签
  const linkLabel = g.append('g')
    .selectAll('text')
    .data(links)
    .join('text')
    .attr('class', 'link-label')
    .attr('text-anchor', 'middle')
    .text(d => d.type || d.label || '');

  // 节点组
  const node = g.append('g')
    .selectAll('.node')
    .data(nodes)
    .join('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', dragstarted)
      .on('drag', dragged)
      .on('end', dragended));

  node.append('circle')
    .attr('r', d => 6 + (d.confidence || 0.5) * 8)
    .attr('fill', d => colorScale(d.type || 'unknown'));

  node.append('text')
    .attr('dx', 12).attr('dy', 4)
    .text(d => d.label || d.id);

  // Tooltip
  node.on('mouseover', (event, d) => {
    const tt = document.getElementById('tooltip');
    tt.innerHTML = `
      <div class="tt-title">${d.label || d.id}</div>
      <div class="tt-row"><span class="tt-key">类型</span><span class="tt-val">${d.type || 'unknown'}</span></div>
      <div class="tt-row"><span class="tt-key">置信度</span><span class="tt-val">${(d.confidence || 0).toFixed(2)}</span></div>
    `;
    tt.style.left = (event.pageX + 12) + 'px';
    tt.style.top = (event.pageY + 12) + 'px';
    tt.classList.add('visible');
  }).on('mouseout', () => {
    document.getElementById('tooltip').classList.remove('visible');
  });

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    linkLabel
      .attr('x', d => (d.source.x + d.target.x) / 2)
      .attr('y', d => (d.source.y + d.target.y) / 2);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// ── 拖拽 ────────────────────────────────────────────────
function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── 图例 ──────────────────────────────────────────────────
function renderLegend(types) {
  const legend = document.getElementById('legend');
  legend.innerHTML = '<div style="font-weight:600;margin-bottom:6px">类型</div>';
  types.forEach(t => {
    const item = document.createElement('div');
    item.className = 'leg-item';
    item.innerHTML = `<div class="leg-dot" style="background:${colorScale(t)}"></div><span>${t}</span>`;
    legend.appendChild(item);
  });
}

// ── 搜索高亮 ──────────────────────────────────────────────
document.getElementById('btn-search').addEventListener('click', async () => {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  try {
    const resp = await fetch(`${API_BASE}/api/knowledge/search?q=${encodeURIComponent(q)}`);
    const data = await resp.json();
    const matchedIds = new Set(data.results.map(r => r.id));

    d3.selectAll('.node circle')
      .attr('opacity', d => matchedIds.has(d.id) ? 1 : 0.2)
      .attr('stroke', d => matchedIds.has(d.id) ? '#f78166' : '#fff');
    d3.selectAll('.link')
      .attr('opacity', d =>
        matchedIds.has(d.source.id || d.source) && matchedIds.has(d.target.id || d.target) ? 1 : 0.1);
  } catch (err) {
    alert('搜索失败: ' + err.message);
  }
});

// ── 事件绑定 ──────────────────────────────────────────────
document.getElementById('btn-refresh').addEventListener('click', () => {
  const fmt = document.getElementById('format-select').value;
  loadGraph(fmt);
});

document.getElementById('format-select').addEventListener('change', () => {
  const fmt = document.getElementById('format-select').value;
  loadGraph(fmt);
});

// 初始加载
loadGraph();
</script>

</body>
</html>
